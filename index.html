<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dark Mode UI</title>

    <!-- CSS -->

    <link rel="stylesheet"
        href="style.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Theme Toggle -->

    <button id="themeBtn">

        <i class="fa-solid fa-moon"></i>

    </button>

    <!-- Container -->

    <div class="container">

        <!-- Card -->

        <div class="card">

            <h1>
                Dark Mode UI
            </h1>

            <p>
                Modern light and dark mode toggle
                using HTML, CSS & JavaScript.
            </p>

            <button class="explore-btn">
                Explore More
            </button>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
